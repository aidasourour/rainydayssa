<body>
<header>
    <a href="index.html"><img src="images-rainy-days/logo.png" class="logo" alt="Rainy Days logo: a dark teal mountain silhouette above bold sans-serif text reading Rainy Days, with a tagline Pushing the Comfort Zone and decorative X symbols below"></a>
        <nav class="nav-bar">
           <ul>
            <li><a href="index.html">Home</a></li>

        <li><a href="contact.html">Contact</a></li>
     </ul>
     </nav>
</header>
<main>
    <div>
        <section class="checkout-section">
            <h1 class="checkout-title">Checkout</h1>
            <form class="checkout-form">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="address">Shipping Address:</label>
                <input type="text" id="address" name="address" required>
                
                <label for="payment">Payment Method:</label>
                <select id="payment" name="payment" required>
                    <option value="credit-card">Credit Card</option>
                    <option value="paypal">PayPal</option>
                    <option value="bank-transfer">Bank Transfer</option>
                </select>
                
                <button type="submit" class="submit-button">Place Order</button>
            </form>
        </section>
    </div>
</main>
</body>
