<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainydays | Products</title>
    <link rel="stylesheet" href="./stylesheet.css?v=30" />
  </head>

  <body>
    <header class="site-header">
      <div class="nav-container">
        <nav class="nav-left">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
        </nav>

        <a href="index.html" class="logo-link">
          <img
            src="./images-rainy-days/logo.png"
            alt="Rainy Days logo"
            class="logo"
        /></a>
        <nav class="nav-right">
          <a href="cart.html"> Cart (<span id="cart-count">0</span>) </a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="products-page">
      <section class="product-intro">
        <div class="filter-buttons">
          <button data-filter="all">All</button>
          <button data-filter="Male">Men</button>
          <button data-filter="Female">Women</button>
        </div>
        <h1>Push the comfort zone</h1>
        <p>Explore our collection of rain jackets.</p>
      </section>

      <div id="loading">Loading products...</div>
      <div id="error"></div>
      <div id="products-container"></div>
    </main>
    <footer>
      <p>&copy; 2024 Rainydays. All rights reserved.</p>
      <a href="terms.html">Terms and Conditions</a>
      <a href="privacy.html">Privacy Policy</a>
    </footer>
    <div id="size-popup" class="size-popup hidden">
      <div class="size-popup-box">
        <button id="close-size-popup" class="close-popup"></button>
        <h2>Select a size</h2>
        <select id="popup-size-select" class="size-select">
          <option value="">Choose size</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>
        <button id="confirm-size-btn">Add to Cart</button>
      </div>
    </div>
    <script type="module" src="js/index.js?v=50"></script>
    <script src="js/cartCount.js"></script>
  </body>
</html>
