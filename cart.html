<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon_io/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon_io/android-chrome-192x192.png"
    />
    <link rel="apple-touch-icon" href="/favicon_io/apple-touch-icon.png" />
    <link rel="stylesheet" href="stylesheet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto@1&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainydays | Cart</title>
  </head>
  <body>
    <header class="site-header">
      <div class="nav-container">
        <a href="index.html" class="logo-link">
          <img
            src="images-rainy-days/logo.png"
            alt="Rainy Days logo"
            class="logo"
          />
        </a>

        <nav class="nav-bar">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="checkout.html">Cart</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="cart-page">
      <h1>Your Cart</h1>

      <section class="cart-layout">
        <div class="cart-left">
          <div id="cart-container"></div>
        </div>

        <aside class="cart-summary">
          <h2>Order Summary</h2>
          <p>Subtotal: <span id="subtotal">$0</span></p>
          <p>Shipping: <span>Calculated at checkout</span></p>
          <hr />
          <h3>Total: <span id="total">$0</span></h3>

          <a href="confirmation.html" class="checkout-button">Checkout</a>
        </aside>
      </section>
    </main>

    <script src="js/cart.js"></script>
    <footer>
      <p>&copy; 2024 Rainydays. All rights reserved.</p>
    </footer>
    <script src="js/cart.js"></script>
  </body>
</html>
