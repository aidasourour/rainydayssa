<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainydays | Cart</title>

    <link rel="stylesheet" href="stylesheet.css?v=20" />
  </head>

  <body>
    <header class="site-header">
      <div class="nav-container">
        <nav class="nav-left">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
        </nav>

        <a href="index.html" class="logo-link">
          <img
            src="images-rainy-days/logo.png"
            alt="Rainy Days logo"
            class="logo"
          />
        </a>

        <nav class="nav-right">
          <a href="cart.html">Cart <span id="cart-count">0</span></a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="cart-page">
      <h1>Your Cart</h1>

      <div class="cart-layout">
        <!-- LEFT: PRODUCTS -->
        <div id="cart-container" class="cart-left"></div>

        <!-- RIGHT: SUMMARY -->
        <aside class="cart-summary">
          <h2>Order Summary</h2>

          <p>Subtotal: <span id="subtotal">$0.00</span></p>
          <p>Shipping: <span>Calculated at checkout</span></p>
          <p>Size: ${product.size}</p>

          <hr />

          <h3>Total: <span id="total">$0.00</span></h3>

          <a href="checkout.html" class="checkout-button">Checkout</a>
        </aside>
      </div>
    </main>

    <footer>
      <p>&copy; 2024 Rainydays. All rights reserved.</p>
    </footer>
    <script src="js/cart.js?v=80"></script>
    <script src="js/cartCount.js?v=80"></script>
    <a href="terms.html">Terms and Conditions</a>
    <a href="privacy.html">Privacy Policy</a>
  </body>
</html>
